# Monthly check for newer versions of the trade and development sources; opens an issue if any are found.
name: Check sources
on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of each month
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: check
        run: |
          set +e
          python pipeline/check_sources.py > report.md
          echo "newer=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - if: steps.check.outputs.newer == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Newer source data available ($(date +%Y-%m))" --body-file report.md --label "source suggestion"
