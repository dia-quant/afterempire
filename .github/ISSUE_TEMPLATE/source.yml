name: Source suggestion
description: Suggest a dataset, document or study for The Archive
labels: ["source suggestion"]
body:
  - type: input
    id: name
    attributes: { label: Source name }
    validations: { required: true }
  - type: textarea
    id: citation
    attributes: { label: Citation and link }
    validations: { required: true }
  - type: textarea
    id: use
    attributes: { label: What it would improve on the site }
